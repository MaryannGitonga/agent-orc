# A batch of tasks for `agent-orc run examples/tasks.yaml`.
#
# `defaults` applies to every task; any task can override any field. Paths are
# resolved relative to this file.

repo: /home/me/code/data-mesh
base_branch: main               # default for the batch; any task can override it
dco_signoff: false              # set true if this repo requires DCO sign-off

defaults:
  cli: claude                   # claude | copilot | codex
  model: sonnet-4-6
  subagents: false
  budget_usd: 2.00              # applied as the CLI's own native cap at launch
  auto_pr: true                 # open a draft PR when the agent finishes
  review:
    enabled: false              # off unless a task turns it on

tasks:
  - id: PROJ-1234
    source: jira://PROJ-1234    # fetched at launch and used as the base prompt
    prompt: "Focus on the retry handler, not the whole sync module"
    branch: fix/proj-1234
    model: opus-4-6             # override the default; this one's tricky
    subagents: true             # complex task, let it delegate
    review:
      enabled: true
      cli: copilot              # a different CLI and model from the worker's,
      model: gpt-5.1            # so the reviewer has different blind spots
      max_rounds: 1             # cap on worker-reviewer round-trips

  - id: PROJ-1240
    source: github://canonical/data-mesh#87  # no prompt: the issue says it all
    branch: chore/proj-1240
    base_branch: release/2.4    # builds on a release branch, not main
    cli: copilot                # different CLI, same batch
    model: gpt-5.1
    budget_credits: 20          # copilot meters in credits, not dollars
    auto_pr: false              # hold off; open it later with `agent-orc pr`
