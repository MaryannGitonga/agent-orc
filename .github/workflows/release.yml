name: release

# Tag-driven. `git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0` starts it;
# publishing then waits for approval in the `release` environment.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # go install checks the module against the Go checksum database, so a
      # tampered release cannot reach CI.
      - name: Install golangci-lint
        run: make lint-install

      # A tag that cannot pass the PR checks is not a release. commit-check is
      # the one omission: it reads origin/main..HEAD, which says nothing useful
      # about a tag.
      - run: make fmt-check vet lint build test-unit test-integration verify-clean

      # A release started from the web UI creates the tag that triggers this, so
      # the release already exists. Refuse it rather than upload into it.
      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "a release for ${GITHUB_REF_NAME} already exists; push a new tag instead" >&2
            exit 1
          fi

  publish:
    name: publish
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Both for the build provenance attestation: id-token to prove the
      # workflow's identity to Sigstore, attestations to store the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser reads the tag and the commits since the last one
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install GoReleaser and syft
        run: make release-tools

      # Builds, archives, checksums, SBOMs and changelog, into a draft release.
      - name: Build the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean

      - name: Attest the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
