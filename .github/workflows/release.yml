name: release

# Tag-driven. `git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0` is the
# whole release process; everything below happens on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Both for the build provenance attestation: id-token to prove the workflow's
  # identity to Sigstore, attestations to store the result on the repository.
  id-token: write
  attestations: write

env:
  GO_VERSION: "1.22"

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # GoReleaser reads the tag and the commits since the last one
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # go install checks each module against the Go checksum database, so a
      # tampered release cannot reach CI.
      - name: Install golangci-lint, GoReleaser and syft
        run: make lint-install release-tools

      # A tag that cannot pass the PR checks is not a release. commit-check is
      # the one omission: it reads origin/main..HEAD, which says nothing useful
      # about a tag.
      - run: make fmt-check vet lint build test-unit test-integration verify-clean

      # A release started from the web UI creates the tag that triggers this, so
      # the release already exists. Refuse it rather than upload into it.
      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "a release for ${GITHUB_REF_NAME} already exists; push a new tag instead" >&2
            exit 1
          fi

      # Builds, archives, checksums, SBOMs and changelog, into a draft release.
      - name: Build the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean

      - name: Attest the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
