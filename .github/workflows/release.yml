name: release

# Tag-driven. `git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0` is the
# whole release process; everything below happens on its own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.22"

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # so `git describe` sees the tag
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # go install checks the module against the Go checksum database, so a
      # tampered release cannot reach CI, and this is how it installs locally.
      - name: Install golangci-lint
        run: make lint-install

      # A tag that cannot pass the PR checks is not a release. commit-check is
      # the one omission: it reads origin/main..HEAD, which says nothing useful
      # about a tag.
      - run: make fmt-check vet lint build test-unit test-integration verify-clean

      - name: Build every target
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            # Both commands, each in its own tarball: the dashboard is optional,
            # and the agent-orc tarball keeps the name and shape it has always had.
            for cmd in agent-orc agent-orc-tui; do
              out="dist/${cmd}_${version}_${os}_${arch}"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build \
                -ldflags "-s -w -X github.com/MaryannGitonga/agent-orc/internal/version.Version=${version}" \
                -o "$out" "./cmd/${cmd}"
              tar -czf "${out}.tar.gz" -C dist "$(basename "$out")"
              rm "$out"
            done
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Starting a release from the web UI creates the tag, which is what
          # triggers this, so by the time it runs the release can already be
          # there. Upload into it rather than failing: either way the tag is
          # what decides which commit ships, and a release with no binaries on
          # it is the one outcome worth ruling out.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
          fi
