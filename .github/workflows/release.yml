name: release

# Tag-driven. `git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0` starts it;
# publishing then waits for approval in the `release` environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to check for an existing release (one that does not exist yet)
        default: v0.0.0-dry-run

permissions:
  contents: read

env:
  GO_VERSION: "1.22"

jobs:
  check:
    name: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Both for the build provenance attestation: id-token to prove the
      # workflow's identity to Sigstore, attestations to store the result.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # GoReleaser reads the tag and the commits since the last one
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install GoReleaser and syft
        run: make release-tools

      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/no-existing-release.sh "${GITHUB_REF_NAME}"

      # Builds, archives, checksums, SBOMs and changelog, into a draft release.
      - name: Build the draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean

      - name: Attest the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

  dry-run:
    name: dry run
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install GoReleaser and syft
        run: make release-tools

      - name: Refuse a tag that already has a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: scripts/no-existing-release.sh "$TAG"

      # A real release refuses a dirty tree, which a snapshot does not check.
      - name: Nothing above left files in the checkout
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short >&2
            echo "the checkout is dirty; goreleaser release would refuse it" >&2
            exit 1
          fi

      - name: Build a snapshot
        run: goreleaser release --snapshot --clean
