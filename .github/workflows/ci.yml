name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fmt-check

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make vet

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install golangci-lint
        run: |
          version=$(make -s print-lint-version)
          curl -sSfL -o /tmp/golangci-lint.tar.gz \
            "https://github.com/golangci/golangci-lint/releases/download/$version/golangci-lint-${version#v}-linux-amd64.tar.gz"
          tar -xzf /tmp/golangci-lint.tar.gz -C /tmp
          sudo install "/tmp/golangci-lint-${version#v}-linux-amd64/golangci-lint" /usr/local/bin/
      - run: make lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test-unit

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    outputs:
      pct: ${{ steps.cov.outputs.pct }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Reported rather than gated. The integration tests drive a separately
      # built binary, so this merges their subprocess coverage with the unit
      # profile; unit coverage alone understates it by about thirty points.
      - name: Coverage
        id: cov
        run: |
          total=$(make -s coverage)
          echo "$total"
          echo "### ${total}" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$(printf '%s' "$total" | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

  # Separate from the job that measures, and never running any of the
  # repository's code: only this one holds a token that can write, and it does
  # so on push alone. Measuring happens on pull requests too, where the code
  # being run is the pull request's own.
  coverage-badge:
    name: coverage badge
    if: github.event_name == 'push'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The README badge reads this file through shields.io. It lives on its own
      # branch so publishing it never touches main's history, which CI checks.
      - name: Publish the shields endpoint
        env:
          PCT: ${{ needs.coverage.outputs.pct }}
        run: |
          case "${PCT%%.*}" in
            9?|100) colour=brightgreen ;;
            8?)     colour=green ;;
            [67]?)  colour=yellow ;;
            *)      colour=red ;;
          esac
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$colour" > /tmp/coverage.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan badges
          git rm -rqf .
          mv /tmp/coverage.json coverage.json
          git add coverage.json
          git commit -qm "chore: coverage ${PCT}%"
          git push -qf origin badges

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test-integration

  verify-clean:
    name: clean tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make verify-clean
