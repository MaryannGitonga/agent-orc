name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fmt-check

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make vet

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # go install checks the module against the Go checksum database, so a
      # tampered release cannot reach CI, and this is how it installs locally.
      - name: Install golangci-lint
        run: make lint-install
      - run: make lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test-unit

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    outputs:
      pct: ${{ steps.cov.outputs.pct }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # Reported rather than gated. The integration tests drive a separately
      # built binary, so this merges their subprocess coverage with the unit
      # profile; unit coverage alone understates it by about thirty points.
      - name: Coverage
        id: cov
        run: |
          total=$(make -s coverage)
          echo "$total"
          echo "### ${total}" >> "$GITHUB_STEP_SUMMARY"
          pct=$(printf '%s' "$total" | grep -oE '[0-9.]+' | head -1)
          # Rather than publish a badge reading "%" with no number in it.
          if [ -z "$pct" ]; then
            echo "no percentage in the coverage output: $total" >&2
            exit 1
          fi
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

  # Separate from the job that measures, and never running any of the
  # repository's code: only this one holds a token that can write, and it does
  # so on push alone. Measuring happens on pull requests too, where the code
  # being run is the pull request's own.
  coverage-badge:
    name: coverage badge
    if: github.event_name == 'push'
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The README badge reads this file through shields.io. It lives on its own
      # branch so publishing it never touches main's history, which CI checks.
      - name: Publish the shields endpoint
        env:
          PCT: ${{ needs.coverage.outputs.pct }}
        run: |
          case "${PCT%%.*}" in
            9?|100) colour=brightgreen ;;
            8?)     colour=green ;;
            [67]?)  colour=yellow ;;
            *)      colour=red ;;
          esac
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$colour" > /tmp/coverage.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # --orphan leaves the index and worktree empty, so there is
          # nothing to remove before writing the one file this branch holds.
          git switch --orphan badges
          mv /tmp/coverage.json coverage.json
          git add coverage.json
          git commit -qm "chore: coverage ${PCT}%"
          git push -qf origin badges

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test-integration

  verify-clean:
    name: clean tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make verify-clean
